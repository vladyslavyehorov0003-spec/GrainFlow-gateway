spring:
  application:
    name: api-gateway

server:
  port: ${PORT:8080}

# Internal service URLs — overridden per environment
services:
  auth:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
  warehouse:
    url: ${WAREHOUSE_SERVICE_URL:http://localhost:8082}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8083}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info

# Swagger UI — single entry point for all services.
# Each url points to our proxy endpoint that rewrites "servers" to /api/v1,
# so "Try it out" always goes through this gateway.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Warehouse Service
        url: /v3/api-docs/warehouse
      - name: Auth Service
        url: /v3/api-docs/auth
      - name: Payment Service
        url: /v3/api-docs/payments
    urls-primary-name: Warehouse Service   # shown first on open
